<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSOM — Активная косметика с прозрачным составом</title>
    <!-- meta description НЕ в shell: задаёт per-page компонент SEO (react-helmet). Статический тег дублировал бы per-page (helmet не заменяет, а добавляет meta) → Яндекс/Google видели дубли description. -->
    <meta name="author" content="DSOM" />

    
    
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:image / og:title / og:description / twitter:* задаёт per-page компонент SEO (react-helmet, абсолютные URL). В shell НЕ дублируем — иначе генерик перебивал бы per-page (соцботы берут первый тег). Все соц-краулеры получают пререндер-снимок с корректным per-page og. -->

    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" sizes="192x192" href="/android-chrome-192x192.png?v=2" />
    <link rel="apple-touch-icon" sizes="512x512" href="/android-chrome-512x512.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <!-- og:title / twitter:title / og:description / twitter:description НЕ в shell: задаёт per-page SEO (react-helmet). Дублирование удалено 18.06 (Яндекс флагнул дубли title/description). -->
